openapi: 3.1.0
info:
  title: Local Pages Tredies
  version: 0.0.1
servers:
- url: http://localhost:8000/api
paths:
  /v1/admin/dashboard:
    get:
      operationId: admin.adminDashboard
      description: GET /api/v1/admin/dashboard
      summary: Retrieve aggregated platform metrics for the admin dashboard
      tags:
      - AdminDashboard
      responses:
        '200':
          description: '`AdminDashboardResource`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AdminDashboardResource'
                required:
                - data
        '401':
          $ref: '#/components/responses/AuthenticationException'
  /v1/admin/locations:
    get:
      operationId: adminLocation.index
      description: GET /api/v1/admin/locations
      summary: List locations with hierarchy, type, and search filters
      tags:
      - AdminLocation
      parameters:
      - name: per_page
        in: query
        schema:
          type: integer
          default: 15
      responses:
        '200':
          description: Paginated set of `AdminLocationResource`
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      allOf:
                      - $ref: '#/components/schemas/AdminLocationResource'
                      - type: object
                        required:
                        - parent
                  links:
                    type: object
                    properties:
                      first:
                        type:
                        - string
                        - 'null'
                      last:
                        type:
                        - string
                        - 'null'
                      prev:
                        type:
                        - string
                        - 'null'
                      next:
                        type:
                        - string
                        - 'null'
                    required:
                    - first
                    - last
                    - prev
                    - next
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                        minimum: 1
                      from:
                        type:
                        - integer
                        - 'null'
                        minimum: 1
                      last_page:
                        type: integer
                        minimum: 1
                      links:
                        type: array
                        description: Generated paginator links.
                        items:
                          type: object
                          properties:
                            url:
                              type:
                              - string
                              - 'null'
                            label:
                              type: string
                            active:
                              type: boolean
                          required:
                          - url
                          - label
                          - active
                      path:
                        type:
                        - string
                        - 'null'
                        description: Base path for paginator generated URLs.
                      per_page:
                        type: integer
                        description: Number of items shown per page.
                        minimum: 0
                      to:
                        type:
                        - integer
                        - 'null'
                        description: Number of the last item in the slice.
                        minimum: 1
                      total:
                        type: integer
                        description: Total number of items being paginated.
                        minimum: 0
                    required:
                    - current_page
                    - from
                    - last_page
                    - links
                    - path
                    - per_page
                    - to
                    - total
                required:
                - data
                - links
                - meta
        '401':
          $ref: '#/components/responses/AuthenticationException'
    post:
      operationId: adminLocation.store
      description: POST /api/v1/admin/locations
      summary: Create a new location adhering to strict geographic hierarchy rules
      tags:
      - AdminLocation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreLocationRequest'
      responses:
        '201':
          description: '`AdminLocationResource`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                    - $ref: '#/components/schemas/AdminLocationResource'
                    - type: object
                      required:
                      - parent
                required:
                - data
        '401':
          $ref: '#/components/responses/AuthenticationException'
        '422':
          $ref: '#/components/responses/ValidationException'
  /v1/admin/locations/{id}:
    get:
      operationId: adminLocation.show
      description: GET /api/v1/admin/locations/{id}
      summary: Show single location details
      tags:
      - AdminLocation
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: '`AdminLocationResource`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AdminLocationResource'
                required:
                - data
        '404':
          description: An error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Error overview.
                    examples:
                    - Location not found.
                required:
                - message
        '401':
          $ref: '#/components/responses/AuthenticationException'
    patch:
      operationId: adminLocation.update
      description: PATCH /api/v1/admin/locations/{id}
      summary: Update location details
      tags:
      - AdminLocation
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLocationRequest'
      responses:
        '200':
          description: '`AdminLocationResource`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                    - $ref: '#/components/schemas/AdminLocationResource'
                    - type: object
                      required:
                      - parent
                required:
                - data
        '401':
          $ref: '#/components/responses/AuthenticationException'
        '422':
          $ref: '#/components/responses/ValidationException'
  /v1/admin/locations/{id}/status:
    patch:
      operationId: adminLocation.updateStatus
      description: PATCH /api/v1/admin/locations/{id}/status
      summary: Update location active/inactive status
      tags:
      - AdminLocation
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum:
                  - active
                  - inactive
              required:
              - status
      responses:
        '200':
          description: '`AdminLocationResource`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                    - $ref: '#/components/schemas/AdminLocationResource'
                    - type: object
                      required:
                      - parent
                required:
                - data
        '422':
          $ref: '#/components/responses/ValidationException'
        '401':
          $ref: '#/components/responses/AuthenticationException'
  /v1/admin/services/{id}/questions:
    get:
      operationId: adminQuestion.index
      description: GET /api/v1/admin/services/{id}/questions
      summary: List all questions for a specific service
      tags:
      - AdminQuestion
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Array of `AdminServiceQuestionResource`
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminServiceQuestionResource'
                required:
                - data
        '401':
          $ref: '#/components/responses/AuthenticationException'
    post:
      operationId: adminQuestion.store
      description: POST /api/v1/admin/services/{id}/questions
      summary: Create a new intake question for a service
      tags:
      - AdminQuestion
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreServiceQuestionRequest'
      responses:
        '201':
          description: '`AdminServiceQuestionResource`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                    - $ref: '#/components/schemas/AdminServiceQuestionResource'
                    - type: object
                      required:
                      - options
                required:
                - data
        '401':
          $ref: '#/components/responses/AuthenticationException'
        '422':
          $ref: '#/components/responses/ValidationException'
  /v1/admin/service-questions/{id}:
    get:
      operationId: adminQuestion.show
      description: GET /api/v1/admin/service-questions/{id}
      summary: Show a single service question with its options
      tags:
      - AdminQuestion
      parameters:
